# Loki and Tempo as Grafana sees them, with the links in both directions (Hub #813): a log record's `trace_id` opens its
# trace, and a span's trace ID finds its records. Both query the contract's labels and structured metadata.
apiVersion: 1
datasources:
  - name: Loki
    uid: bunny-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace
          matcherType: label
          matcherRegex: trace_id
          url: "$${__value.raw}"
          datasourceUid: bunny-tempo
          urlDisplayLabel: Open trace
  - name: Tempo
    uid: bunny-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: bunny-loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_namespace="bunny"} | trace_id="$${__span.traceId}"'
      nodeGraph:
        enabled: true
      search:
        hide: false
