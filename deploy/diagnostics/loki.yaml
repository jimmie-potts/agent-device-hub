# Loki for one operator's private diagnostics (Hub #813). Stream labels are the contract's three: namespace, service and
# environment; everything else, trace and span IDs included, is structured metadata. Retention is seven days, enforced
# by the compactor; ingestion limits bound what a week can hold (docs/bunny-container.md "Diagnostics stack").
auth_enabled: false
analytics:
  reporting_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: "2020-10-24"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
ingester:
  lifecycler:
    min_ready_duration: 1s
  chunk_idle_period: 30m
  max_chunk_age: 2h
pattern_ingester:
  enabled: false
query_scheduler:
  use_scheduler_ring: false
frontend:
  address: 127.0.0.1
  scheduler_dns_lookup_period: 1s
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 1h
  retention_delete_worker_count: 10
  delete_request_store: filesystem
limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  volume_enabled: true
  # Admission: 1 MiB/s with a 4 MiB burst, so a week holds at most about 600 GB of raw text even under a flood; the
  # runtime's records are hundreds of bytes and tens an hour, so this is a safety bound, not an expected rate.
  ingestion_rate_mb: 1
  ingestion_burst_size_mb: 4
  per_stream_rate_limit: 1MB
  per_stream_rate_limit_burst: 4MB
  max_line_size: 16KB
  max_line_size_truncate: false
  max_global_streams_per_user: 1000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_lookback: 168h
  otlp_config:
    resource_attributes:
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes:
            - service.namespace
            - service.name
            - deployment.environment.name
