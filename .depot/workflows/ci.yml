# Depot CI Migration
# Source: .github/workflows/ci.yml
#
# No changes were necessary.

name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/work-guide/**']
  pull_request:
    paths-ignore: ['docs/work-guide/**']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  workflow:
    name: Workflow checks on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:workflow
      - run: npm run test:workflow
      - name: Validate guide record contract fixtures
        run: node --test docs/work-guide/contracts/records.test.mjs
      - name: Validate epic Guide contract fixtures
        run: node --test docs/work-guide/contracts/epic-guide/contracts.test.mjs
      - run: npm run test:preflight
      - name: Check isolated Linux hook qualification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 /usr/bin/true
          npm run test:performance:linux
          npm run test:performance:standalone
  contracts:
    name: Contracts and state Python ${{ matrix.python }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.12', '3.14']
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: npm ci
      - run: python -m pip install -r requirements-contracts.txt -r packages/observability/requirements-host.txt
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:maintenance:built
      - run: npm run test:maintenance:package:built
      - run: npm run test:observability:built
      - run: npm run test:observability:pilot
      - run: npm run test:observability:python
      - run: npm run test:observability:query
      - run: npm run test:observability:package:built
      - run: npm run test:contracts:built
      - run: npm run test:contracts:python
      - run: npm run test:performance
      - run: npm run test:package:built
      - run: npm run test:events:built
      - run: npm run test:events:python
      - run: npm run test:lifecycle:built
      - run: npm run test:lifecycle:python
      - run: npm run test:lifecycle:package:built
      - run: npm run test:setup:built
      - run: npm run test:hub:built
      - run: npm run test:hub:package:built
      - run: npm run test:agent-state:built
      - run: npm run test:agent-state:python
      - run: npm run test:agent-state:package:built
      - run: npm run test:agent-status:built
      - run: npm run test:lifx:built
      - run: npm run test:tidbyt:built
      - run: npm run test:local-controllers:built
      - run: npm run test:tidbyt:python
      - run: npm run test:wispr:built
      - run: npm run test:wispr:package:built
      - run: npm run test:chompi-bridge:built
  firmware:
    name: Firmware host tests and ARM build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm run test:firmware
      - run: npm run test:firmware:arm
  mcp:
    name: MCP on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:mcp:built
      - run: npm run test:mcp:protocol:built
      - run: npm run test:mcp:package:built
      - run: npm run test:hub:mcp:built
  dashboard:
    name: Dashboard browser and contracts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run typecheck:dashboard
      - run: npm run test:dashboard
      - run: npm run test:dashboard:browser
      - run: npm run test:observability:browser
  app-verify:
    name: App verification on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Depot's runner is not booted with systemd (PR #552): lifecycle tests skip with a printed reason; unsupervised capture tests, including the Hub's steps, run.
      - run: npm run test:app-verify:built
      - run: npm run test:app-verify:package:built
      - run: npm run test:hub:verify:built
      - run: npm run test:verify-host
