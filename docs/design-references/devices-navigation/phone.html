<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devices navigation design reference · Phone preview</title>
<style>
  * { box-sizing: border-box }
  html { color-scheme: light dark }
  body { margin: 0; background: #0d1016; color: #dce4f3; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif }
  main { display: grid; justify-items: center; gap: 16px; padding: 18px 12px }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: min(410px, 100%) }
  h1 { margin: 0; font-size: 16px; font-weight: 550 }
  a { color: #c2ceea }
  iframe { display: block; width: min(410px, 100%); height: min(864px, calc(100dvh - 76px)); min-height: 460px; border: 10px solid #06080d; border-radius: 38px; background: #151c2b; box-shadow: 0 0 0 1px #ffffff2a, 0 15px 50px #0008 }
  @media (max-width: 440px) {
    main { padding: 12px 0 0; gap: 10px }
    header { padding-inline: 14px }
    iframe { width: 100%; height: calc(100dvh - 44px); border: 0; border-radius: 0 }
  }
</style>
</head>
<body>
<main>
  <header><h1>Phone preview</h1><a href="index.html">Desktop preview</a></header>
  <iframe src="index.html" title="Interactive Devices popout at phone width"></iframe>
</main>
</body>
</html>
