<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e8edf6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151c2b">
<title>Devices navigation design reference</title>
<style>
/* Tokens copied from the runtime skin (apps/runtime/dashboard/src/skins/quiet-glass.css). Prototype only. */
:root{
  color-scheme:light dark;
  --bg:light-dark(#e8edf6,#151c2b);--panel:light-dark(#f7f9fe,#253046);--raised:light-dark(#e3e9f6,#34415b);--inset:light-dark(#edf1f9,#1c263a);
  --text:light-dark(#25314b,#eff3fc);--muted:light-dark(#53617a,#bdc9dd);
  --edge:light-dark(#cbd5e6,#4d5b75);--edge-strong:light-dark(#556582,#9aacd0);--edge-faint:light-dark(#d9e0ed,#3f4c65);
  --accent:light-dark(#354567,#dce6fc);--accent-ink:light-dark(#ffffff,#202c45);--primary-hover:light-dark(#485d84,#c5d7fa);
  --link:light-dark(#354f84,#b8d0ff);--focus:light-dark(#2557ae,#b0ceff);
  --pending:light-dark(#8a5800,#f4d28b);--pending-text:light-dark(#805100,#f4d28b);
  --warn-bg:light-dark(#fff2d6,#3c3324);--warn-edge:light-dark(#9d741d,#c5a762);
  --disabled-bg:light-dark(#e6ebf3,#202a3e);--disabled-text:light-dark(#647187,#a2afc5);--disabled-edge:light-dark(#cbd5e6,#4d5b75);
  --ok:light-dark(#21734f,#7fd6a8);
  --radius:14px;--card-radius:26px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --type-small:.875rem;--type-label:.8rem;--type-title:2rem;--type-heading:1.25rem;--type-subheading:1.1rem;--type-brand:1.15rem;
  --space-xxs:2px;--space-xs:4px;--space-s:8px;--space-m:16px;--space-l:24px;--space-xl:32px;
  --shell-bg:radial-gradient(ellipse at 0 0,light-dark(#cbd9f4,#293650),transparent 65%),radial-gradient(ellipse at 100% 100%,light-dark(#ebdcde,#302b3f),transparent 65%),var(--bg);
  --rail-bg:light-dark(#e2e9f5,#1b2436);
  --shadow:0 12px 28px light-dark(#50628016,#00000030),inset 0 1px 0 light-dark(#ffffff,#ffffff14);
  --pop-shadow:0 20px 44px light-dark(#3b4c6e2e,#00000075),0 2px 6px light-dark(#3b4c6e14,#00000040),inset 0 1px 0 light-dark(#ffffff,#ffffff14);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --measure:920px;
}
html{font-size:.9375rem;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
*{box-sizing:border-box}
body{margin:0;background:#0d1016;color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}

/* Harness: the stage stops above a band kept free for the picker, so the picker never covers the composer. */
#stage{position:relative;height:100dvh;overflow:hidden}
/* The phone preview page embeds this file without the picker. */
.embed #stage{height:100dvh}
.embed :is(.proto-picker,.harness-note){display:none}
.harness-note{position:fixed;bottom:34px;margin:0;font:12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:rgba(255,255,255,.5)}
.harness-note.l{left:24px}.harness-note.r{right:24px}
.harness-note a{color:inherit}
@media (max-width:860px){.harness-note{display:none}}

/* ---------- Shared app surface ---------- */
.app{position:relative;height:100%;display:grid;overflow:hidden;background:var(--shell-bg);line-height:1.4}
:where(.app) a{color:inherit;text-decoration:none}
:where(.app) :is(button,textarea,select,input){font:inherit}
:where(.app) button{cursor:pointer}
/* Phone baseline: taps fire without the double-tap wait, controls are not selectable text, 16px inputs stop iOS zooming the page, and inner scrollers do not drag the page with them. */
:where(.app) :is(button,a,summary){touch-action:manipulation}
:where(.app) :is(button,a[data-go],a[data-profile],summary){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){
  .app :is(input,textarea,select){font-size:16px}
  /* Keyboard hints mean nothing without a hardware keyboard. */
  .app :is(.rail-jump kbd,.input-help p:first-child){display:none}
}
.app :is(.rail-scroll,.transcript,.main-scroll,.details-body,.pop.fly,#pal-list){overscroll-behavior:contain}
.app :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app :is(.input-surface textarea,.pal-search input):focus-visible{outline:none}
:where(.app) :is(h1,h2,h3,p,dl,ul,ol){margin-top:0}
.i{flex:none;display:block}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-s);min-height:44px;padding:var(--space-s) var(--space-m);border:1px solid var(--accent);border-radius:var(--radius);background:var(--accent);color:var(--accent-ink);font-weight:500;white-space:nowrap;transition:transform 160ms var(--ease-out),background-color 150ms ease-out,border-color 150ms ease-out}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.secondary{background:transparent;color:var(--text);border-color:var(--edge)}
.btn.sm{min-height:36px;padding:0 12px;border-radius:12px;font-size:var(--type-small)}
.btn:disabled{background:var(--disabled-bg);color:var(--disabled-text);border-color:var(--disabled-edge);cursor:not-allowed}
.btn[aria-expanded=true]{background:var(--raised);border-color:var(--edge-strong)}
.icon-btn{display:inline-grid;place-items:center;flex:none;width:36px;height:36px;padding:0;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);transition:transform 160ms var(--ease-out),background-color 150ms ease-out}
.icon-btn:active{transform:scale(.97)}
.icon-btn[aria-current]{background:var(--panel);border-color:var(--edge);color:var(--text)}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){background:var(--primary-hover)}
  .btn.secondary:hover:not(:disabled){background:var(--raised);border-color:var(--edge-strong)}
  .icon-btn:hover{background:var(--raised);color:var(--text)}
}

.avatar{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--edge);background:var(--raised);color:var(--text);font-size:.72rem;font-weight:600;letter-spacing:0}
.tag{flex:none;margin-left:auto;padding:1px 7px;border:1px solid var(--edge-faint);border-radius:999px;color:var(--muted);font-size:.72rem;font-weight:400}
.dot-attn{flex:none;width:8px;height:8px;margin-left:auto;border-radius:50%;background:var(--pending)}
.count{display:grid;place-items:center;flex:none;min-width:20px;height:20px;margin-left:auto;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:600}
.status-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status-dot[data-off]{background:var(--pending)}
.brand{flex:none;color:var(--text);font-size:var(--type-brand);font-weight:500;letter-spacing:.09em;line-height:1.15;border-radius:8px}
.brand small{display:block;margin-top:2px;color:var(--muted);font-size:var(--type-label);font-weight:400;letter-spacing:0}

/* Menus: one popover vocabulary for every variant. Origin-aware scale, ease-out, exit faster than entrance. */
.menu-wrap{position:relative;display:inline-flex}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:30;min-width:236px;padding:6px;border:1px solid var(--edge);border-radius:16px;background:var(--panel);box-shadow:var(--pop-shadow);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-4px) scale(.98);transform-origin:top left;transition:opacity 110ms ease-out,transform 110ms ease-out,visibility 0s linear 110ms}
.pop.right{left:auto;right:0;transform-origin:top right}
.pop.up{top:auto;bottom:calc(100% + 8px);transform:translateY(4px) scale(.98);transform-origin:bottom left}
.pop[data-open]{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity 160ms var(--ease-out),transform 160ms var(--ease-out),visibility 0s}
.pop-label{margin:0;padding:8px 10px 4px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.pop-item{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:0 10px;border:0;border-radius:10px;background:transparent;color:var(--text);font-weight:400;text-align:left;white-space:nowrap}
.pop-item small{color:var(--muted);font-size:var(--type-small)}
.pop-item[aria-current]{font-weight:600}
.pop-item .i.tick{margin-left:auto;color:var(--muted)}
.pop-item .tag+.i.tick,.pop-item .dot-attn+.i.tick{margin-left:8px}
.app .pop-item:focus-visible{outline:none;background:var(--raised)}
@media (hover:hover) and (pointer:fine){.pop-item:hover{background:var(--raised)}}
.pop-body{padding:8px 10px;font-size:var(--type-small);white-space:normal;width:260px}
.pop-body p{margin:0 0 4px}
.pop-hint{color:var(--muted);font-size:var(--type-small);line-height:1.45}
.pop-body .btn{margin-top:6px}

/* Main column and ordinary pages */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:0 var(--space-xl)}
.main-scroll{overflow:auto}
.page-wrap{width:100%;max-width:1240px;padding:var(--space-l) 0 var(--space-xl)}
.page{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-m);margin-bottom:var(--space-l)}
.page h1{margin:0;font-size:var(--type-title);font-weight:500;letter-spacing:-.03em;line-height:1.15}
.backlink{display:inline-flex;align-items:center;gap:6px;min-height:36px;margin-bottom:var(--space-s);color:var(--link)!important;font-size:var(--type-small)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:var(--space-l);align-items:start}
.home-columns{display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,1fr);gap:var(--space-l);align-items:start}
.stack{display:grid;gap:var(--space-l);min-width:0}
.card{min-width:0;padding:var(--space-l);border:1px solid var(--edge);border-radius:var(--card-radius);background:var(--panel);box-shadow:var(--shadow)}
.card h2{margin:0 0 var(--space-s);font-size:var(--type-heading);font-weight:500;letter-spacing:-.02em}
.card p{margin:0 0 var(--space-s);line-height:1.5}
.hint{margin:var(--space-s) 0 0!important;color:var(--muted);font-size:var(--type-small);line-height:1.5}
.facts{display:grid;margin:0;font-size:var(--type-small)}
.facts>div{display:flex;justify-content:space-between;gap:var(--space-m);padding:var(--space-s) 0;border-bottom:1px solid var(--edge-faint)}
.facts>div:last-child{border-bottom:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;overflow-wrap:anywhere}
.rows{display:grid;margin:0;padding:0;list-style:none}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--edge-faint)}
.rows li:first-child{border-top:0}
.rows .grow{flex:1;min-width:0}
.rows .grow strong{display:block;font-weight:500}
.rows .grow small{color:var(--muted);font-size:var(--type-small)}
.chip{flex:none;padding:2px 8px;border:1px solid var(--edge);border-radius:var(--radius);background:#162235;color:#bdc9dd;font-size:var(--type-label);white-space:nowrap}
.chip[data-chip=working]{border-color:#2bff63;color:#2bff63}
.chip[data-chip=approval]{border-color:#ff4a4a;color:#ff7a7a}
.chip[data-chip=finished]{border-color:#5b9bff;color:#8bb8ff}
.seg{display:flex;flex-wrap:wrap;gap:var(--space-xs);width:fit-content;max-width:100%;padding:var(--space-xs);border-radius:var(--radius);background:var(--inset)}
.seg-btn{min-height:40px;padding:0 var(--space-m);border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;transition:transform 160ms var(--ease-out)}
.seg-btn:active{transform:scale(.97)}
.seg-btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.toggle{position:relative;flex:none;width:42px;height:26px;padding:0;border:1px solid var(--edge);border-radius:999px;background:var(--inset);transition:background-color 160ms ease-out,border-color 160ms ease-out}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform 160ms var(--ease-out),background-color 160ms ease-out}
.toggle[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked=true]::after{transform:translateX(16px);background:var(--accent-ink)}
.dir-links{display:grid;gap:var(--space-xs)}
.dir-links a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:var(--space-s) var(--space-m);border-radius:var(--radius);background:var(--inset);color:var(--text);font-weight:500}
@media (hover:hover) and (pointer:fine){.dir-links a:hover{background:var(--raised)}.seg-btn:hover:not([aria-pressed=true]){background:var(--raised);color:var(--text)}}
.field{display:grid;gap:var(--space-xs);margin-bottom:var(--space-m);color:var(--muted);font-size:var(--type-small)}
.field select{min-height:44px;padding:var(--space-s);border:1px solid var(--edge);border-radius:var(--radius);background:var(--inset);color:var(--text)}
.check{display:flex;align-items:center;gap:var(--space-s)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.inline-status{display:inline-flex;align-items:center;gap:var(--space-s);padding:var(--space-xs) var(--space-s);border:1px solid var(--edge);border-radius:var(--radius);background:var(--inset);font-size:var(--type-label)}

/* ---------- Conversation workspace ---------- */
.conv{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:0 var(--space-m);min-height:0}
.conv-main{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:.5rem;min-width:0;min-height:0;padding-bottom:var(--space-m)}
.transcript{overflow:auto;padding:var(--space-m) .375rem .75rem}
.transcript ol,.conv-empty,.demo-note{max-width:var(--measure);margin-inline:auto}
.transcript ol{display:grid;gap:var(--space-l);margin-block:0;padding:0;list-style:none}
.transcript li{min-width:0}
.transcript li[data-role=owner]{justify-self:end;max-width:min(85%,36rem);padding:.65rem .85rem;border:1px solid var(--edge-faint);border-radius:var(--radius);background:var(--raised)}
.transcript li[data-role=assistant] article{max-width:46rem}
.speaker{color:var(--muted);font-size:var(--type-small);font-weight:650}
.msg-text{margin:.35rem 0 0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.read-aloud{min-height:2.25rem;margin-top:.15rem;padding:.35rem .55rem;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--muted);font-size:var(--type-small);font-weight:500}
@media (hover:hover) and (pointer:fine){.read-aloud:hover{color:var(--text);background:var(--raised)}}
.tool{margin-top:.5rem;border-top:1px solid var(--edge-faint)}
.tool summary{padding:.55rem 0;color:var(--muted);font-size:var(--type-small);cursor:pointer}
.tool p{margin:0 0 .75rem;padding-left:.75rem;border-left:1px solid var(--edge-faint);font-size:var(--type-small)}
.demo-note{margin-bottom:var(--space-m);color:var(--muted);font-size:var(--type-small)}
.conv-empty{display:grid;align-content:center;min-height:80%;text-align:center}
.conv-empty h3{margin:0 0 var(--space-xs);font-size:var(--type-heading);font-weight:500}
.conv-empty p{margin:0;color:var(--muted)}
.compose{display:grid;gap:.35rem;justify-self:center;width:min(calc(100% - .75rem),var(--measure));min-width:0}
.cue{display:flex;align-items:center;gap:var(--space-s);margin:0;color:var(--muted);font-size:var(--type-small)}
.cue.attn{color:var(--pending-text)}
.input-surface{position:relative;display:grid;gap:var(--space-xs);padding:var(--space-s) var(--space-m);border:1px solid var(--edge);border-radius:18px;background:var(--panel);transition:border-color 150ms ease-out}
.input-surface:has(textarea:focus-visible){border-color:var(--focus)}
.input-surface textarea{display:block;width:100%;min-height:3rem;max-height:35dvh;padding:var(--space-xs) 0;border:0;outline:0;background:transparent;color:var(--text);resize:vertical}
.input-surface textarea::placeholder{color:var(--muted)}
.composer-actions,.input-help{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-xxs) var(--space-s)}
.composer-actions .send{min-width:4rem;margin-left:auto}
.input-help{padding-inline:var(--space-xs);color:var(--muted);font-size:var(--type-small)}
.input-help p{margin:0}
.pop .switch-row{justify-content:space-between;white-space:normal}
.details{display:grid;grid-template-rows:auto minmax(0,1fr);min-width:0;min-height:0;margin:var(--space-s) 0 var(--space-m);border:1px solid var(--edge);border-radius:var(--radius);background:var(--panel);overflow:hidden}
.details>header{display:flex;align-items:center;justify-content:space-between;gap:var(--space-s);padding:var(--space-s) var(--space-m);border-bottom:1px solid var(--edge-faint)}
.details h2{margin:0;font-size:var(--type-subheading);font-weight:500}
.details-body{overflow:auto;padding-inline:var(--space-m);font-size:var(--type-small)}
.details-profile{display:flex;align-items:baseline;gap:var(--space-s);margin:0;padding-block:var(--space-m)}
.details-profile small{color:var(--muted)}
.details-body details{border-top:1px solid var(--edge-faint)}
.details-body summary{min-height:2.75rem;padding-block:.75rem;font-weight:600;cursor:pointer}
.details-body details>*:last-child{margin-bottom:var(--space-m)}
.details-body ul{display:grid;gap:.5rem;margin:var(--space-s) 0 var(--space-m);padding:0;list-style:none}
.details-body ul a{color:var(--link)}
.scrim{position:absolute;inset:0;z-index:40;background:light-dark(#25314b47,#05080f99)}
.details-scrim{display:none}
@media (min-width:1120px){.conv[data-details]{grid-template-columns:minmax(0,1fr) clamp(17rem,23vw,20.25rem)}}
@media (max-width:1119px){
  .details{position:absolute;top:var(--space-s);right:var(--space-s);bottom:var(--space-s);z-index:45;width:min(23rem,calc(100% - var(--space-l)));margin:0;box-shadow:var(--pop-shadow)}
  .details-scrim{display:block}
  .details.just-opened{animation:drawer-in 220ms var(--ease-out)}
  .details-scrim.just-opened{animation:fade-in 160ms ease-out}
}
@keyframes drawer-in{from{opacity:0;transform:translateX(16px)}}
@keyframes fade-in{from{opacity:0}}

/* ---------- Rail: shared by every variant in this round ---------- */
.v-rail{grid-template-columns:184px minmax(0,1fr)}
.rail{position:relative;z-index:10;display:flex;flex-direction:column;gap:var(--space-s);min-width:0;min-height:0;padding:var(--space-m) 12px 12px;border-right:1px solid var(--edge-faint);background:var(--rail-bg)}
.rail .icon-btn{position:relative}
.rail-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-s);flex:none;min-height:44px;padding-left:10px}
.rail-jump{position:relative;display:flex;align-items:center;gap:10px;flex:none;width:100%;height:36px;padding:0 8px 0 12px;border:1px solid var(--edge);border-radius:12px;background:var(--inset);color:var(--muted);text-align:left;white-space:nowrap;transition:transform 160ms var(--ease-out),border-color 150ms ease-out}
.rail-jump:active{transform:scale(.985)}
.rail-jump kbd{margin-left:auto}
kbd{padding:2px 6px;border:1px solid var(--edge);border-radius:6px;background:var(--panel);color:var(--muted);font:inherit;font-size:.72rem}
.rail-scroll{flex:1;display:flex;flex-direction:column;gap:2px;min-height:0;margin:0 -6px;padding:2px 6px;overflow:hidden auto}
.rail-pinned{flex:none;display:grid;gap:2px}
/* A long list fades out at the bottom edge instead of ending in a hard cut. Not on the icon rail, where the mask would clip tooltips. */
[data-rail=expanded] .rail-scroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 14px),transparent);mask-image:linear-gradient(#000 calc(100% - 14px),transparent)}
.rail-group{display:grid;gap:2px}
.rail-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:38px;padding:0 12px;border:1px solid transparent;border-radius:var(--radius);background:transparent;color:var(--muted);font-weight:500;text-align:left;white-space:nowrap}
.rail-item .lbl{overflow:hidden;text-overflow:ellipsis}
.rail-item .go{margin-left:auto;color:var(--muted)}
.rail-item[aria-current]{border-color:var(--edge-strong);background:var(--panel);box-shadow:var(--shadow);color:var(--text)}
.rail-item[data-ancestor]{color:var(--text)}
.rail-item[aria-expanded=true]{background:var(--raised);color:var(--text)}
/* With the tap highlight gone, a press needs its own feedback. */
:is(.rail-item,.pop-item,.pal-item,.dir-links a):active{background:var(--raised)}
.rail-item.sub{min-height:30px;padding-left:44px;border-radius:10px;font-size:var(--type-small);font-weight:400}
.rail-item.sub[aria-current]{border-color:transparent;background:var(--raised);box-shadow:none;font-weight:500}
.rail-item.mod{min-height:30px;border-radius:12px;font-size:var(--type-small)}
.rail-item.more{display:none}
.mono{display:grid;place-items:center;flex:none;width:22px;height:22px;border:1px solid var(--edge);border-radius:7px;background:var(--inset);color:var(--muted);font-size:.66rem;font-weight:600;letter-spacing:0}
.rail-item:is([aria-current],[data-ancestor]) .mono{color:var(--text)}
@media (hover:hover) and (pointer:fine){

      <article class="card"><h2>Routines</h2><ul class="rows">${[['evening', 'Evening lights', 'Every day at sunset'], ['away', 'Away sweep', 'When the hub mode becomes Away'], ['wake', 'Wake the office', 'Weekdays at 07:30']].map(([key, name, when]) => `<li><span class="grow"><strong>${name}</strong><small>${when}</small></span>${toggle('routine', key, S.routines[key], name)}</li>`).join('')}</ul></article>
      <article class="card"><h2>Art schedule</h2>${facts([['Next appearance', 'Today · 19:30 UTC'], ['Displays', 'Pixoo, Tidbyt'], ['Theme', 'Rain window']])}<p class="hint">Times use the runtime's UTC clock.</p></article></div>`;
    case 'settings': return `${head('Settings')}<div class="grid">
      <article class="card"><h2>Connections</h2><p class="hint" style="margin:0 0 var(--space-m)!important">Connection evidence, running build and operator tools.</p><nav class="dir-links"><a href="#" data-go="connections">Connections${icon('chevr', 14)}</a></nav></article>
      <article class="card"><h2>Browser session</h2><p><span class="inline-status"><span class="status-dot"${S.feed ? '' : ' data-off'}></span>${feedText()}</span></p><button class="btn secondary" data-act="feed">${S.feed ? 'Disconnect' : 'Sign in again'}</button></article>
      <article class="card"><h2>Companions</h2>${listLinks([['preferences', 'Preferences'], ['knowledge', 'Companion knowledge']], 'Companion settings')}</article>
      <article class="card"><h2>Navigation rail</h2>${railSettings()}</article>
      <article class="card"><h2>Art theme</h2><label class="field">Dashboard theme<select><option>Quiet glass</option><option>Follow the current art</option></select></label><p class="hint">The theme changes this browser only.</p></article></div>`;
    case 'connections': return `<a href="#" class="backlink" data-go="settings">${icon('back', 14)}Back to Settings</a>${head('Connections')}<div class="grid">
      <article class="card"><h2>Connection</h2>${facts([['Feed', feedText()], ['Core sessions', S.feed ? 'Synced' : 'Not synced'], ['Core revision', '4127'], ['Syncs', '3'], ['Last change', '12 seconds ago']])}</article>
      <article class="card"><h2>Observed sources</h2><p>claude / this-computer / desktop</p><p>codex / this-computer / desktop</p><p class="hint">A connected feed does not prove a fresh session, successful task, read chat or physical device result.</p></article></div>`;
    case 'preferences': return `${head('Preferences')}<div class="grid"><article class="card"><h2>Spoken replies</h2>
      <label class="field">Voice<select><option>Warm, medium pace</option><option>Bright, quick pace</option><option>Low, slow pace</option></select></label>
      <label class="check"><input type="checkbox" checked> Speak replies on this computer</label><p class="hint">Preferences are saved privately and apply to every conversation profile.</p></article></div>`;
    case 'knowledge': return `${head('Companion knowledge')}<div class="grid"><article class="card"><h2>Saved notes</h2><ul class="rows">
      <li><span class="grow"><strong>Room names</strong><small>Living room, Bedroom, Office, Kitchen</small></span></li>
      <li><span class="grow"><strong>Movie night</strong><small>Media mode, wall at 15%, floor lamp off</small></span></li>
      <li><span class="grow"><strong>Quiet hours</strong><small>22:30 to 07:00, no spoken replies</small></span></li></ul></article></div>`;
    case 'duck': return `${head('Duck conversation')}<div class="grid"><article class="card"><h2>Latest exchange</h2><p><strong>You</strong><br>Quack if the tests passed.</p><p><strong>MicroDuck</strong><br>Synthetic result: quack.</p><p class="hint">The duck speaks through the Demo profile and makes no paid calls.</p></article></div>`;
    default: {
      const info = pageInfo(route);
      if (info === undefined) return `<div class="card"><h2>Nothing at this address</h2><p><a href="#" data-go="home">Go to the home</a></p></div>`;
      const heading = info.module.pages.length > 1 && info.title !== info.module.label ? `${info.module.label} · ${info.title}` : info.title;
      return `${head(heading)}<div class="grid"><article class="card"><h2>Observations</h2>${facts(FACTS[route] ?? [])}<p class="hint">Observations are the last records the hub received. They are not proof of a physical result.</p></article></div>`;
    }
  }
}

function detailsHTML() {
  const profile = PROFILES[S.profile], demo = S.profile !== 'bunny', turns = S.threads[S.profile].length;
  const opened = S.opened ? ' just-opened' : '';
  return `<div class="scrim details-scrim${opened}" data-act="details"></div>
  <aside class="details${opened}" aria-label="Conversation details">
    <header><h2>Conversation details</h2><button class="btn secondary sm" data-act="details" aria-label="Close details">Close</button></header>
    <div class="details-body">
      <p class="details-profile"><strong>${profile.name}</strong>${demo ? '<small>Demo</small>' : ''}</p>
      <details open><summary>Capabilities</summary>${facts([['Provider', demo ? 'Synthetic (no paid calls)' : 'Anthropic'], ['Allowed tools', 'Device status, hub mode, sessions'], ['Coding worker', 'Available on this computer']])}<p class="hint">Reads need no approval. Proposed changes need your approval in the conversation.</p></details>
      <details><summary>Task activity</summary>${turns ? facts([['Status', S.working === S.profile ? 'running' : S.pending[S.profile] ? 'waiting' : 'succeeded'], ['Saved messages', String(turns)], ['Tool calls', demo ? '0' : '1']]) : `<p>No task saved for ${profile.name}.</p>`}</details>
      <details><summary>Usage</summary>${facts([[demo ? 'Synthetic model usage' : 'Model usage', turns ? `${turns * 412} ${demo ? 'units' : 'tokens'}` : 'Unknown'], ['Paid cost', demo ? '0 (synthetic calls)' : 'Unknown (provider billing)']])}</details>
      <details><summary>Conversation settings</summary><p>Conversation is ${S.enabled ? 'on' : 'off'}.</p><button class="btn secondary sm" data-act="power">${S.enabled ? 'Disable' : 'Enable'} conversation</button>
        <ul><li><a href="#" data-go="preferences">Preferences</a></li><li><a href="#" data-go="knowledge">Companion knowledge</a></li></ul></details>
    </div>
  </aside>`;
}

function conversationHTML() {
  const key = S.profile, profile = PROFILES[key], thread = S.threads[key], pending = Boolean(S.pending[key]), working = S.working === key;
  const draft = S.drafts[key] ?? '';
  const cue = working ? 'Working' : pending ? 'Needs your answer' : thread.length ? 'Task completed' : '';
  const canSend = S.enabled && !working && draft.trim() !== '';
  const message = item => `<li data-role="${item.role}"><article aria-label="${item.role} message"><strong class="speaker">${item.role === 'owner' ? 'You' : profile.name}</strong><p class="msg-text" dir="auto">${esc(item.text)}</p>${item.tool ? `<details class="tool"><summary>Tool result</summary><p>${esc(item.tool)}</p></details>` : ''}${item.role === 'assistant' ? '<button class="read-aloud" data-act="read">Read aloud</button>' : ''}</article></li>`;
  return `<section class="conv" aria-label="${profile.name} conversation"${S.details ? ' data-details' : ''}>
    <div class="conv-main">
      <div class="transcript">
        ${key === 'bunny' ? '' : '<p class="demo-note">Demo profile. No paid calls.</p>'}
        ${thread.length ? `<ol aria-label="Saved conversation messages">${thread.map(message).join('')}</ol>` : `<div class="conv-empty"><h3>What’s on your mind?</h3><p>Messages to ${profile.name} are saved privately.</p></div>`}
      </div>
      <div class="compose">
        ${S.enabled ? '' : '<p class="cue">Conversation is off. <button class="btn sm" data-act="power">Enable conversation</button></p>'}
        ${cue ? `<p role="status" class="cue${pending && !working ? ' attn' : ''}">${cue}</p>` : ''}
        <div class="input-surface">
          <label class="vh" for="msg">${pending ? 'Answer' : 'Message'}</label>
          <textarea id="msg" rows="2" enterkeyhint="send" placeholder="${pending ? 'Answer the question' : `Message ${profile.name}`}"${S.enabled ? '' : ' disabled'}>${esc(draft)}</textarea>
          <div class="composer-actions">
            <span class="menu-wrap"><button class="btn secondary sm" data-menu aria-controls="pop-voice" aria-expanded="false">${icon('wave', 16)}<span id="voice-label">${S.voice ? 'Voice on' : 'Voice off'}</span></button>
              <div class="pop up" id="pop-voice" role="dialog" aria-label="Spoken replies"><p class="pop-label">Spoken replies</p>
                <button class="pop-item switch-row" data-act="voice">Speak replies on this computer<span class="toggle" id="voice-switch" role="switch" aria-checked="${S.voice}"></span></button>
                <p class="pop-hint" style="margin:0;padding:4px 10px 8px">Long replies stay written only. Playback is reported separately.</p></div></span>
            <button class="btn sm send" data-act="send"${canSend ? '' : ' disabled'}>${pending ? 'Answer' : 'Send'}</button>
          </div>
        </div>
        <div class="input-help"><p>Enter to ${pending ? 'answer' : 'send'}. Shift+Enter for a new line.</p><p>Messages stay in this demo.</p></div>
      </div>
    </div>
    ${S.details ? detailsHTML() : ''}
  </section>`;
}

const mainHTML = (before = '') => S.route === 'conversation'
  ? `<main class="main">${before}${conversationHTML()}</main>`
  : `<main class="main main-scroll">${before}<div class="page-wrap">${pageBody(S.route)}</div></main>`;

/* ================= Rail pieces shared by every variant in this round ================= */
const WIDE = 1200;
const sizeClass = () => innerWidth >= WIDE ? 'wide' : 'narrow';
/** The last choice made at this window size wins. Until one is made, wide windows expand the rail and narrower ones collapse it. */
const railOpen = () => S.railPref[sizeClass()] ?? sizeClass() === 'wide';
const railDest = () => S.route === 'conversation' ? 'conversation' : destOf(S.route);
const isSubpage = info => info.module.pages.length > 1 && info.title !== info.module.label;
const shortOf = id => { const info = pageInfo(id); return isSubpage(info) ? info.title : info.module.label; };
const suffixOf = id => { const info = pageInfo(id); return isSubpage(info) ? info.module.label : ''; };
const fullOf = id => suffixOf(id) ? `${suffixOf(id)} · ${shortOf(id)}` : shortOf(id);
const monoOf = id => { const info = pageInfo(id); return isSubpage(info) ? (info.module.label[0] + info.title[0]).toUpperCase() : info.module.label.slice(0, 2); };
const monoTile = text => `<span class="mono" aria-hidden="true">${text}</span>`;
const pinnable = route => pageInfo(route) !== undefined && route !== 'conversation';
const pinButton = route => pinnable(route)
  ? `<button class="btn secondary sm pin-btn" data-act="pin" data-v="${route}" aria-pressed="${S.pins.includes(route)}">${icon('pin', 16)}<span>${S.pins.includes(route) ? 'Pinned' : 'Pin to rail'}</span></button>` : '';

function railSettings() {
  const describe = size => { const pref = S.railPref[size]; return `${(pref ?? size === 'wide') ? 'Expanded' : 'Collapsed'} · ${pref === null ? 'automatic' : 'your choice'}`; };
  const untouched = S.railPref.wide === null && S.railPref.narrow === null;
  return `${facts([[`Wide windows (${WIDE}px and up)`, describe('wide')], ['Narrower windows', describe('narrow')]])}
    <p class="hint">The rail remembers the last choice you made at each size.</p>
    <button class="btn secondary sm" style="margin-top:var(--space-m)" data-act="rail-reset"${untouched ? ' disabled' : ''}>Reset to automatic</button>`;
}

const hubItem = ([id, label, glyph]) => `<a href="#" class="rail-item" data-go="${id}" data-tip="${label}"${cur(S.route === id)}${railDest() === id && S.route !== id ? ' data-ancestor' : ''}>${icon(glyph)}<span class="lbl">${label}</span>${id === 'home' ? countBadge() : ''}</a>`;
const conversationsGroup = () => `<p class="rail-label">Conversations</p><nav class="rail-group" aria-label="Conversations">${Object.entries(PROFILES).map(([id, item]) =>
  `<a href="#" class="rail-item" data-profile="${id}" data-tip="${item.name} · ${S.pending[id] ? 'Needs your answer' : item.kind}"${cur(S.route === 'conversation' && S.profile === id)}><span class="avatar">${item.initial}${attnDot(id)}</span><span class="lbl">${item.name}</span>${id === 'bunny' ? '' : '<small class="tag">Demo</small>'}</a>`).join('')}</nav>`;
const statusControl = () => `<span class="menu-wrap"><button class="icon-btn" data-menu aria-controls="pop-status" aria-expanded="false" aria-label="${feedText()}. Connection details" title="${feedText()}"><span class="status-dot"${S.feed ? '' : ' data-off'}></span></button>${statusPop('pop-status', 'up')}</span>`;

function railHead() {
  const open = railOpen();
  return `<div class="rail-head"><a href="#" class="brand" data-go="home">B.U.N.N.Y.<small class="proto-tag">Design reference</small></a>
      <button class="icon-btn hide-mobile" data-act="rail" aria-pressed="${!open}" aria-label="${open ? 'Collapse' : 'Expand'} navigation" title="${open ? 'Collapse' : 'Expand'} navigation">${icon('sidebar')}</button></div>
    <button class="rail-jump" data-act="palette" aria-haspopup="dialog" aria-label="Jump to a page or conversation" data-tip="Jump to… ⌘K">${icon('search', 16)}<span class="lbl">Jump to…</span><kbd>⌘K</kbd></button>`;
}
const railFoot = () => `<div class="rail-foot"><a href="#" class="rail-item" data-go="settings" data-tip="Settings"${cur(destOf(S.route) === 'settings')}>${icon('settings')}<span class="lbl">Settings</span></a>${statusControl()}</div>`;

/* ---------- Jump palette ---------- */
function paletteEntries() {
  const out = [];
  const glyph = id => HUB.find(([key]) => key === id)?.[2] ?? (id === 'settings' || id === 'connections' ? 'settings' : 'page');
  const hint = id => { const info = pageInfo(id); return info ? `${info.module.cat} › ${info.module.label}` : id === 'connections' ? 'Settings' : 'Hub'; };
  for (const id of S.recents.filter(item => item !== S.route).slice(0, 3)) out.push({group: 'Recent', id, label: titleOf(id), hint: hint(id), glyph: 'clock'});
  for (const [id, profile] of Object.entries(PROFILES)) out.push({group: 'Conversations', id: `profile:${id}`, label: profile.name, hint: S.pending[id] ? 'Needs your answer' : profile.kind, glyph: 'chat', attn: Boolean(S.pending[id]), current: S.route === 'conversation' && S.profile === id});
  for (const [id, label, mark] of [...HUB, ['settings', 'Settings', 'settings']]) out.push({group: 'Hub', id, label, hint: id === 'home' && S.inbox.length ? `${S.inbox.length} in the inbox` : '', glyph: mark, current: S.route === id});
  for (const module of MODULES) for (const [id, title] of module.pages) {
    if (id === 'conversation') continue;
    out.push({group: destOf(id) === 'devices' ? 'Device pages' : 'Tools & settings', id, label: module.pages.length > 1 && title !== module.label ? `${module.label} · ${title}` : module.label, hint: module.pages.length > 1 ? module.cat : `${module.cat}${title !== module.label ? ` · ${title}` : ''}`, glyph: glyph(id), current: S.route === id});
  }
  out.push({group: 'Tools & settings', id: 'connections', label: 'Connections', hint: 'Settings', glyph: 'settings', current: S.route === 'connections'});
  return out;
}
function paletteItems() {
  const query = S.pal.q.trim().toLowerCase(), all = paletteEntries();
  if (query === '') return all;
  const tokens = query.split(/\s+/);
  const rank = item => { const label = item.label.toLowerCase(); return label.startsWith(query) ? 0 : label.includes(query) ? 1 : 2; };
  return all.filter(item => item.group !== 'Recent' && tokens.every(token => `${item.label} ${item.hint} ${item.group}`.toLowerCase().includes(token))).sort((a, b) => rank(a) - rank(b));
}
function renderPaletteList() {
  const list = document.getElementById('pal-list');
  if (list === null) return;
  const items = paletteItems(), grouped = S.pal.q.trim() === '';
  S.pal.items = items;
  S.pal.i = Math.max(0, Math.min(S.pal.i, items.length - 1));
  if (items.length === 0) { list.innerHTML = `<p class="pal-empty">No page or conversation matches “${esc(S.pal.q.trim())}”.</p>`; return; }
  let group, html = '';
  items.forEach((item, index) => {
    if (grouped && item.group !== group) { group = item.group; html += `<p class="pop-label">${group}</p>`; }
    html += `<button class="pal-item" role="option" id="pal-${index}" data-pal="${index}" aria-selected="${index === S.pal.i}" tabindex="-1">${icon(item.glyph, 16)}<span class="pal-name">${esc(item.label)}</span>${item.attn ? '<span class="dot-attn"></span>' : ''}<span class="pal-hint">${esc(item.hint)}</span>${item.current ? icon('check', 14, 'tick') : ''}</button>`;
  });
  list.innerHTML = html;
  document.getElementById('pal-input')?.setAttribute('aria-activedescendant', `pal-${S.pal.i}`);
  list.querySelector('[aria-selected="true"]')?.scrollIntoView({block: 'nearest'});
}
const paletteHTML = () => `<div class="scrim pal-scrim" data-act="palette"></div>
    <div class="palette" role="dialog" aria-label="Jump to">
      <div class="pal-search">${icon('search', 18)}<input id="pal-input" type="text" role="combobox" aria-expanded="true" aria-controls="pal-list" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="go" placeholder="Jump to a page or conversation…"></div>
      <div id="pal-list" role="listbox" aria-label="Destinations"></div>
      <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    </div>`;

/** The frame every variant shares: rail, main column and palette. Only the rail's contents differ. */
function shell(name, rail) {
  const profile = PROFILES[S.profile];
  const waiting = Object.keys(S.pending).some(id => !(S.route === 'conversation' && S.profile === id));
  const menu = `<button class="icon-btn only-mobile" data-act="drawer" aria-label="Open navigation${waiting ? '. A conversation needs your answer' : ''}">${icon('menu')}${waiting ? '<span class="dot-attn"></span>' : ''}</button>`;
  const jump = `<button class="icon-btn only-mobile" data-act="palette" aria-haspopup="dialog" aria-label="Jump to a page or conversation">${icon('search')}</button>`;
  const head = S.route === 'conversation'
    ? `<header class="main-head" data-kind="conversation">${menu}<div class="head-title"><h1>${profile.name}</h1><small>${profile.kind}</small></div><span class="proto-tag top-proto only-mobile">Design reference</span>${jump}${detailsButton()}</header>`
    : `<header class="main-head" data-kind="page">${menu}<span class="brand">B.U.N.N.Y.</span><span class="proto-tag top-proto">Design reference</span>${jump}</header>`;
  return `<div class="app v-rail v-${name}" data-rail="${railOpen() ? 'expanded' : 'collapsed'}">
    <aside class="rail" aria-label="Navigation">${rail}</aside>
    <div class="scrim drawer-scrim" data-act="drawer"></div>
    ${mainHTML(head)}
    ${paletteHTML()}
  </div>`;
}

function renderPinned() {
  const pins = S.pins.filter(pinnable);
  const row = (id, visiting) => `<div class="rail-row${visiting ? ' visiting' : ''}"><a href="#" class="rail-item mod" data-go="${id}" data-tip="${fullOf(id)}${visiting ? ' · not pinned' : ''}"${cur(S.route === id)}>${monoTile(monoOf(id))}<span class="lbl">${shortOf(id)}</span>${suffixOf(id) ? `<small class="suffix">${suffixOf(id)}</small>` : ''}</a>
    <button class="row-btn" data-act="pin" data-v="${id}" aria-label="${visiting ? 'Pin' : 'Unpin'} ${fullOf(id)}" title="${visiting ? 'Pin to the rail' : 'Unpin'}">${icon(visiting ? 'pin' : 'x', 14)}</button></div>`;
  const list = pins.map(id => row(id, false)).join('') + (pinnable(S.route) && !pins.includes(S.route) ? row(S.route, true) : '');
  const hub = HUB.map(entry => entry[0] === 'devices'
    ? `<button class="rail-item" data-menu aria-controls="pop-devices" aria-expanded="false" aria-haspopup="true" aria-label="Devices" data-tip="Devices"${S.route === 'devices' ? ' aria-current="true"' : railDest() === 'devices' ? ' data-ancestor' : ''}>${icon(entry[2])}<span class="lbl">Devices</span>${icon('chevr', 14, 'go')}</button>`
    : hubItem(entry)).join('');
  return shell('pinned', `${railHead()}
    <div class="rail-scroll"><nav class="rail-group" aria-label="Main navigation">${hub}</nav>
      <p class="rail-label">Pinned</p>${list ? `<nav class="rail-group" aria-label="Pinned pages">${list}</nav>` : ''}</div>
    <div class="rail-pinned">${conversationsGroup()}</div>
    ${railFoot()}
    ${drawDeviceMenu()}`);
}

const stage = document.getElementById('stage');

const app = () => stage.querySelector('.app');
let openOnLoad = null;
const paletteOpen = () => stage.querySelector('.palette[data-open]') !== null;

function syncHash(push = true) {
  const url = new URL(location);
  url.hash = S.route === 'conversation' ? `conversation/${S.profile}` : S.route;
  if (url.href !== location.href) history[push ? 'pushState' : 'replaceState'](null, '', url);
}
function readHash() {
  const [hashRoute, profile] = location.hash.slice(1).split('/');
  const route = hashRoute === 'nanoleaf-wall' ? 'nanoleaf' : hashRoute;
  S.route = titleOf(route) === undefined ? 'conversation' : route;
  if (S.route === 'conversation') S.profile = PROFILES[profile] === undefined ? 'bunny' : profile;
}
/** Re-renders the current variant in place. `focus` is a selector, or a list tried in order. Variant switches go through the picker's own mount. */
function rerender(focus, keepScroll = true) {
  S.focus = focus ?? null;
  S.scroll = keepScroll ? stage.querySelector('.main-scroll')?.scrollTop ?? 0 : 0;
  stage.innerHTML = renderPinned();
}
function afterRender() {
  const transcript = stage.querySelector('.transcript');
  if (transcript !== null) transcript.scrollTop = transcript.scrollHeight;
  const page = stage.querySelector('.main-scroll');
  if (page !== null) page.scrollTop = S.scroll;
  S.scroll = 0;
  S.opened = false;
  if (S.focus !== null) {
    const target = [].concat(S.focus).map(selector => stage.querySelector(selector)).find(found => found !== null);
    S.focus = null;
    if (target !== undefined && !target.disabled) {
      if (target.matches('h1')) target.tabIndex = -1;
      target.focus({preventScroll: !target.matches('#transmission summary')});
      if (target.id === 'msg') target.setSelectionRange(target.value.length, target.value.length);
    }
  }
  if (openOnLoad !== null) {
    const what = openOnLoad;
    openOnLoad = null;
    if (innerWidth <= 760) app()?.setAttribute('data-drawer', '');
    const trigger = what === 'devices' ? stage.querySelector('[aria-controls="pop-devices"]') : null;
    if (trigger !== null) toggleMenu(trigger);
  }
}
function go(route) {
  S.playlistSaved = false;
  if (route !== S.route) {
    S.recents = [S.route, ...S.recents.filter(item => item !== S.route && item !== route)].slice(0, 4);
    S.route = route;
    if (route !== 'conversation') S.details = false;
  }
  syncHash();
  rerender(route === 'conversation' ? '#msg' : route === 'tidbyt-transmission' ? '#transmission summary' : '.page h1', false);
}
function pickProfile(profile) {
  S.profile = profile;
  if (S.route !== 'conversation') { go('conversation'); return; }
  syncHash();
  rerender('#msg');
}
function send() {
  const profile = S.profile, text = (S.drafts[profile] ?? '').trim();
  if (text === '' || !S.enabled || S.working !== null) return;
  S.threads[profile].push({role: 'owner', text});
  S.drafts[profile] = '';
  delete S.pending[profile];
  S.working = profile;
  rerender('#msg');
  setTimeout(() => {
    S.working = null;
    S.threads[profile].push({role: 'assistant', text: profile === 'bunny' ? 'Prototype reply: nothing was sent to a model or a device. This transcript is sample data.' : `Synthetic result: ${text}`});
    if (S.route === 'conversation' && S.profile === profile && !paletteOpen() && stage.querySelector('.pop[data-open]') === null) rerender(document.activeElement?.id === 'msg' ? '#msg' : undefined);
  }, 700);
}

function closeDrawer() {
  closeMenus();
  app()?.removeAttribute('data-drawer');
  stage.querySelector('.main-head [data-act="drawer"]')?.focus();
}

function closeMenus() {
  for (const pop of stage.querySelectorAll('.pop[data-open]')) pop.removeAttribute('data-open');
  for (const trigger of stage.querySelectorAll('[data-menu][aria-expanded="true"]')) trigger.setAttribute('aria-expanded', 'false');
}
function positionDeviceMenu() {
  const pop = stage.querySelector('#pop-devices[data-open]');
  if (pop === null || innerWidth <= 760) return;
  const rail = pop.closest('.rail');
  const trigger = stage.querySelector('[aria-controls="pop-devices"]');
  const top = trigger.getBoundingClientRect().top - rail.getBoundingClientRect().top;
  pop.style.setProperty('--devices-menu-top', top + 'px');
}

function visibleMenuItems(pop) {
  return [...pop.querySelectorAll('.pop-item')].filter(item =>
    item.matches('summary') || !item.closest('details:not([open])'));
}

function toggleMenu(trigger) {
  const pop = document.getElementById(trigger.getAttribute('aria-controls'));
  const open = pop.hasAttribute('data-open');
  closeMenus();
  if (open) return;
  pop.setAttribute('data-open', '');
  trigger.setAttribute('aria-expanded', 'true');
  positionDeviceMenu();
  requestAnimationFrame(() => {
    const items = visibleMenuItems(pop);
    (items.find(item => item.hasAttribute('aria-current')) ?? items[0])?.focus();
  });
}
function togglePalette(force) {
  const palette = stage.querySelector('.palette');
  if (palette === null) return;
  const open = force ?? !palette.hasAttribute('data-open');
  closeMenus();
  app().removeAttribute('data-drawer');
  palette.toggleAttribute('data-open', open);
  stage.querySelector('.pal-scrim').toggleAttribute('data-open', open);
  if (open) {
    // Closing hands focus back to wherever it was, so ⌘K from the composer returns to the composer.
    S.pal.q = ''; S.pal.i = 0; S.pal.from = document.activeElement;
    const input = document.getElementById('pal-input');
    input.value = '';
    renderPaletteList();
    requestAnimationFrame(() => { input.focus(); });
  } else {
    const from = S.pal.from;
    S.pal.from = null;
    (from instanceof HTMLElement && from.isConnected && from !== document.body ? from : stage.querySelector('.rail [data-act="palette"]'))?.focus();
  }
}
function openPaletteItem(index) {
  const item = S.pal.items[index];
  if (item === undefined) return;
  if (item.id.startsWith('profile:')) pickProfile(item.id.slice(8));
  else go(item.id);
}

function act(name, el) {
  const value = el.dataset.v;
  switch (name) {
    case 'rail': S.railPref[sizeClass()] = !railOpen(); store.set('rail', S.railPref); rerender('.rail-head [data-act="rail"]'); break;
    case 'rail-reset': S.railPref = {wide: null, narrow: null}; store.set('rail', S.railPref); rerender('.rail [aria-current]'); break;
    case 'pin': S.pins = S.pins.includes(value) ? S.pins.filter(id => id !== value) : [...S.pins, value]; store.set('pins', S.pins); rerender(el.closest('.rail') !== null ? [`.rail [data-act="pin"][data-v="${value}"]`, '.rail [aria-current]'] : '.page [data-act="pin"]'); break;
    case 'close-menu': { const trigger = stage.querySelector('[data-menu][aria-expanded="true"]'); closeMenus(); trigger?.focus(); break; }
    case 'drawer':
      if (app().hasAttribute('data-drawer')) closeDrawer();
      else {
        app().setAttribute('data-drawer', '');
        stage.querySelector('[aria-controls="pop-devices"]')?.focus();
      }
      break;
    case 'details': S.details = !S.details; S.opened = S.details; rerender('.details-btn'); break;
    case 'palette': togglePalette(); break;
    case 'send': send(); break;
    case 'power': S.enabled = !S.enabled; rerender(S.enabled ? '#msg' : '[data-act="power"]'); break;
    case 'feed': S.feed = !S.feed; rerender('[data-act="feed"]'); break;
    case 'pick-playlist':
      S.selectedPlaylist = value;
      S.playlistSaved = false;
      rerender('#playlist-name');
      break;
    case 'save-playlist': {
      const playlist = S.playlists[S.selectedPlaylist];
      playlist.name = playlist.draft.trim();
      playlist.draft = playlist.name;
      S.playlistSaved = true;
      rerender('#playlist-name');
      break;
    }
    case 'ack': S.inbox = S.inbox.filter(item => item.id !== value); rerender('[data-act="ack"]'); break;
    case 'mode': S.mode = value; for (const button of el.parentElement.children) button.setAttribute('aria-pressed', String(button === el)); break;
    case 'light': S.lights[value] = !S.lights[value]; el.setAttribute('aria-checked', String(S.lights[value])); break;
    case 'routine': S.routines[value] = !S.routines[value]; el.setAttribute('aria-checked', String(S.routines[value])); break;
    case 'voice': S.voice = !S.voice; document.getElementById('voice-switch').setAttribute('aria-checked', String(S.voice)); document.getElementById('voice-label').textContent = S.voice ? 'Voice on' : 'Voice off'; break;
    case 'read': { const reading = el.textContent === 'Stop'; el.textContent = reading ? 'Read aloud' : 'Stop'; if (!reading) setTimeout(() => { if (el.isConnected) el.textContent = 'Read aloud'; }, 2400); break; }
  }
}

stage.addEventListener('click', event => {
  const palItem = event.target.closest('[data-pal]');
  if (palItem !== null) { openPaletteItem(Number(palItem.dataset.pal)); return; }
  if (event.target.closest('.pop, [data-menu]') === null) closeMenus();
  const target = event.target.closest('[data-menu], [data-go], [data-profile], [data-act]');
  if (target === null) return;
  if (target.closest('a') !== null || target.tagName === 'A') event.preventDefault();
  if (target.hasAttribute('data-menu')) { toggleMenu(target); return; }
  if (target.dataset.go !== undefined) { go(target.dataset.go); return; }
  if (target.dataset.profile !== undefined) { pickProfile(target.dataset.profile); return; }
  act(target.dataset.act, target);
});
document.addEventListener('click', event => { if (!stage.contains(event.target)) closeMenus(); });

stage.addEventListener('toggle', event => {
  const brand = event.target;
  if (!brand.matches('details[data-light-brand]') || !stage.contains(brand)) return;
  if (brand.open) S.expandedLightBrands.add(brand.dataset.lightBrand);
  else S.expandedLightBrands.delete(brand.dataset.lightBrand);
  brand.querySelector('summary').setAttribute('aria-expanded', String(brand.open));
}, true);

stage.addEventListener('input', event => {
  if (event.target.id === 'msg') {
    S.drafts[S.profile] = event.target.value;
    const button = stage.querySelector('.send');
    if (button !== null) button.disabled = !(S.enabled && S.working === null && event.target.value.trim() !== '');
  } else if (event.target.id === 'playlist-name') {
    const playlist = S.playlists[S.selectedPlaylist];
    playlist.draft = event.target.value;
    S.playlistSaved = false;
    stage.querySelector('[data-act="save-playlist"]').disabled = !playlist.draft.trim() || playlist.draft.trim() === playlist.name;
    stage.querySelector('#playlist-result').textContent = '';
  } else if (event.target.id === 'pal-input') {
    S.pal.q = event.target.value; S.pal.i = 0;
    renderPaletteList();
  }
});
stage.addEventListener('mousemove', event => {
  const item = event.target.closest('[data-pal]');
  if (item === null || Number(item.dataset.pal) === S.pal.i) return;
  stage.querySelector('.pal-item[aria-selected="true"]')?.setAttribute('aria-selected', 'false');
  S.pal.i = Number(item.dataset.pal);
  item.setAttribute('aria-selected', 'true');
});
stage.addEventListener('keydown', event => {
  const target = event.target;
  if (target.id === 'msg') {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); if (!event.repeat) send(); }
    return;
  }
  if (target.id === 'pal-input') {
    if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
      event.preventDefault();
      const count = S.pal.items.length;
      if (count > 0) { S.pal.i = (S.pal.i + (event.key === 'ArrowDown' ? 1 : -1) + count) % count; renderPaletteList(); }
    } else if (event.key === 'Enter') { event.preventDefault(); openPaletteItem(S.pal.i); }
    return;
  }
  const pop = target.closest('.pop[data-open]');
  if (pop === null) return;
  const list = visibleMenuItems(pop), index = list.indexOf(target);
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') { event.preventDefault(); list[(index + (event.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length]?.focus(); }
  else if (event.key === 'Home' || event.key === 'End') { event.preventDefault(); list[event.key === 'Home' ? 0 : list.length - 1]?.focus(); }
});
document.addEventListener('keydown', event => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
  if ((event.key.toLowerCase() === 'k' && (event.metaKey || event.ctrlKey)) || (event.key === '/' && !typing)) { event.preventDefault(); togglePalette(); return; }
  if (event.key !== 'Escape') return;
  if (paletteOpen()) { togglePalette(false); return; }
  const trigger = stage.querySelector('[data-menu][aria-expanded="true"]');
  if (trigger !== null) { closeMenus(); trigger.focus(); return; }
  if (app()?.hasAttribute('data-drawer')) { closeDrawer(); return; }
  if (S.details) { S.details = false; rerender('.details-btn'); }
});

// Automatic collapse: crossing the wide/narrow boundary re-reads the rail state for the new size.
const bands = () => innerWidth <= 760 ? 'phone' : sizeClass();
let lastSize = bands();
addEventListener('resize', () => {
  const size = bands();
  if (size === lastSize) { positionDeviceMenu(); return; }
  lastSize = size;
  if (app() !== null) {
    if (stage.querySelector('#pop-devices[data-open]')) openOnLoad = 'devices';
    rerender(document.activeElement?.id === 'msg' ? '#msg' : undefined);
  }
});

new MutationObserver(() => { if (stage.firstElementChild !== null) afterRender(); }).observe(stage, {childList: true});
addEventListener('hashchange', () => { readHash(); rerender(undefined, false); });
readHash();
openOnLoad = 'devices';
rerender(undefined, false);
</script>
</body>
</html>
