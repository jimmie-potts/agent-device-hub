name: Bug
description: Record a reproducible failure and its expected behavior.
labels: ["bug", "status:backlog"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Failure and reproduction
      description: Use sanitized evidence and exact versions without private agent or device data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, verification and delivery target
      description: Link blockers and state whether source, installation or physical verification is requested.
    validations:
      required: true
  - type: textarea
    id: guide
    attributes:
      label: Guide placement
      description: >-
        The work guide's ## Guide convention (docs/work-guide/README.md).
        Replace <topic id> with one of shared-codex, bunny-controls,
        nanoleaf-presentation, nanoleaf-devices, pixoo-media, controls-music,
        desktop-controls, work-guide, assistant-access, hosting-migrations,
        development-workflow, steam-deck. Optional lines: **Note:** a one-line reading
        note, **Workaround:** if one is deliberately recorded, and
        **Highlight:** next step | decision | later, <reason>.
      value: |
        ## Guide

        **Topic:** <topic id>
    validations:
      required: true
