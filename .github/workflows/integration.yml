name: Integration
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.sha }}
  cancel-in-progress: false
jobs:
  integration:
    name: Integrated source checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:workflow
      - run: npm run test:workflow
      - run: npm run test:preflight
