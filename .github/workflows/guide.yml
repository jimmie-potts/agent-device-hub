# Guide-only changes skip every workflow and use the guide-only CI exception (docs/sdlc.md).

name: Work guide
on:
  push:
    branches: [main]
    paths-ignore: ['docs/work-guide/**']
  pull_request:
    paths-ignore: ['docs/work-guide/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  guide:
    name: Work guide build and browser checks
    runs-on: ubuntu-latest
    # The job takes 3 to 9 minutes; the limit leaves room for two stalled browser-install attempts and their cleanups (#862).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 docs/work-guide/work/build_guide.py
      - run: git diff --exit-code -- docs/work-guide/outputs
      - run: python3 docs/work-guide/work/test_maintenance.py
      - name: Check system design documents
        run: python3 docs/system-design/check.py
      # Hosted runners sometimes stall in apt downloads during --with-deps until the job's limit (#862). The script gives
      # each attempt 300 s, above the slowest successful install so far (293 s, on #987's own run), and retries a stalled
      # or failed attempt twice. An install that runs past 300 s costs a retry, which resumes from apt's cache, not a failure.
      - name: Prepare the pinned browser checker
        timeout-minutes: 20
        run: |
          npm install --prefix "$RUNNER_TEMP/guide-browser" --no-save --no-package-lock playwright@1.63.0
          bash scripts/install-browser.sh node "$RUNNER_TEMP/guide-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check epic browser adapters and generated fixtures
        run: |
          npm ci
          node --test docs/work-guide/browser/tests/*.test.mjs
          GUIDE_BROWSER_EVIDENCE="$RUNNER_TEMP/epic-browser-review" node docs/work-guide/browser/tests/browser.mjs
          node docs/work-guide/browser/build.mjs --check
          GUIDE_BROWSER_EVIDENCE="$RUNNER_TEMP/epic-browser-review" node docs/work-guide/browser/tests/live.mjs
      - name: Check the guide and capture review evidence
        run: GUIDE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/guide-browser/node_modules/playwright" node docs/work-guide/work/check_guide.cjs
      - name: Check system design navigation and print output
        run: GUIDE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/guide-browser/node_modules/playwright" BUNNY_DESIGN_RECEIPTS="$RUNNER_TEMP/bunny-design-review" node docs/system-design/check.cjs
      - name: Check shared Places on mobile
        run: GUIDE_PLAYWRIGHT_MODULE="$RUNNER_TEMP/guide-browser/node_modules/playwright" BUNNY_PLACES_RECEIPTS="$RUNNER_TEMP/bunny-places-review" node docs/skins/check_places.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work-guide-review
          path: |
            docs/work-guide/work/guide-*.png
            docs/work-guide/work/guide-print-check.pdf
            docs/work-guide/work/guide-verification.json
            ${{ runner.temp }}/bunny-places-review/
            ${{ runner.temp }}/bunny-design-review
            ${{ runner.temp }}/epic-browser-review/
          if-no-files-found: error
          retention-days: 14
