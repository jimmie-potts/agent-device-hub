# Markdown-only changes skip this workflow; the Workflow and Work guide workflows still run (#861).
# GitHub-hosted runners replaced Depot CI in #870.

name: Checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/work-guide/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/work-guide/**', '**/*.md']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  core:
    name: Build, lint and core tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: npm ci
      - run: python -m pip install -r requirements-contracts.txt -r packages/observability/requirements-host.txt
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint:js
      - run: npm run test:maintenance:built
      - run: npm run test:maintenance:package:built
      - run: npm run test:observability:built
      - run: npm run test:observability:pilot
      - run: npm run test:observability:python
      - run: npm run test:observability:query
      - run: npm run test:observability:package:built
      - run: npm run test:contracts:built
      - run: npm run test:contracts:python
      - run: npm run test:performance
      - run: npm run test:package:built
      - run: npm run test:events:built
      - run: npm run test:events:python
      - run: npm run test:sdk:built
      - run: npm run test:lifecycle:built
      - run: npm run test:lifecycle:python
      - run: npm run test:lifecycle:package:built
      - run: npm run test:hub:built
      - run: npm run test:hub:package:built
      - run: npm run test:agent-state:built
      - run: npm run test:agent-state:python
      - run: npm run test:agent-state:package:built
      - run: npm run test:agent-status:built
      - run: npm run test:lifx:built
      - run: npm run test:tidbyt:built
      - run: npm run test:local-controllers:built
      - run: npm run test:tidbyt:python
      - run: npm run test:wispr:built
      - run: npm run test:wispr:package:built
      - run: npm run test:chompi-bridge:built
      - run: npm run test:chompi-bridge:scenarios
      - run: npm run test:mcp:built
      - run: npm run test:mcp:protocol:built
      - run: npm run test:mcp:package:built
      - run: npm run test:pixoo:built
      - run: npm run test:nanoleaf:built
  firmware:
    name: Firmware host tests and ARM build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm run test:firmware
      - run: npm run test:firmware:arm
  dashboard:
    name: Dashboard browser and contracts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # The first GitHub-hosted run took 523 s of the earlier 600 s budget (#870).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:dashboard
      - run: npm run test:dashboard:browser
      - run: npm run test:observability:browser
  app-verify:
    name: App verification on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # GitHub-hosted runners have a systemd user manager, but app-verify's lease timer does not read back under their
    # systemd 255 (#873). Hiding the user bus keeps the coverage Depot's runner gave: lifecycle tests skip.
    env:
      XDG_RUNTIME_DIR: ''
      DBUS_SESSION_BUS_ADDRESS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Lifecycle tests need a systemd user manager and skip with a printed reason without one (hidden above, #873); unsupervised capture tests, including the Hub's steps, always run.
      - run: npm run test:app-verify:built
      - run: npm run test:app-verify:package:built
      - run: npm run test:hub:verify:built
      - run: npm run test:verify-host
      # Hub #853: CHOMPI bridge boundary checks with real crossing runs, every capture step through runCaptureStep, and the control page's browser and accessibility check.
      - run: npm run test:chompi-bridge:verify:built
      - run: npm run test:chompi-bridge:browser
