# Ready PRs use focused or conservative admission; drafts skip expensive jobs.
# Main integration and pinned full release qualification have separate workflows (#1364).
# The expanding qualification input always forces full coverage.

name: Checks
on:
  workflow_call:
    inputs:
      qualification:
        type: boolean
        default: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  select:
    name: Select affected checks
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      groups: ${{ steps.select.outputs.groups }}
      owners: ${{ steps.select.outputs.owners }}
      head: ${{ steps.select.outputs.head }}
      firmware: ${{ steps.select.outputs.firmware }}
      app-verify: ${{ steps.select.outputs.app-verify }}
      runtime-verify: ${{ steps.select.outputs.runtime-verify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/ci-selection
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUNNY_RELEASE_QUALIFICATION: ${{ inputs.qualification }}
        run: node scripts/ci-selection/cli.mjs select
  core:
    outputs:
      owners: ${{ steps.standalone.outputs.owners }}
    name: Build, lint and core tests on ${{ matrix.os }}
    needs: select
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    # The same source passed in 10m30s on a PR but hit 15 minutes twice on main (#1037, PR #1078).
    # Leave finite headroom for slower hosted runs while retaining every suite.
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.mode == 'standalone' && needs.select.outputs.head || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: npm ci
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: python -m pip install -r requirements-contracts.txt -r packages/observability/requirements-host.txt
      - run: npm run build
      - run: npm run typecheck
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: node --test scripts/release/tests/*.test.mjs
      - run: npm run lint:js
      - run: npm run test:workspace-audit
      - name: Install Chromium with its system dependencies
        if: contains(fromJSON(needs.select.outputs.owners), 'microduck-browser')
        timeout-minutes: 20
        run: bash scripts/apt-retry.sh 300 npx playwright install --with-deps chromium
      - name: Run complete standalone owning commands
        id: standalone
        env:
          STANDALONE_OWNERS: ${{ needs.select.outputs.owners }}
          STANDALONE_HEAD: ${{ needs.select.outputs.head }}
        run: node scripts/ci-selection/run-standalone.mjs
      - if: contains(fromJSON(needs.select.outputs.groups), 'maintenance')
        run: npm run test:maintenance:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'maintenance')
        run: npm run test:maintenance:package:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:observability:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:observability:pilot
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:observability:python
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:observability:query
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:observability:package:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:contracts:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:events:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:music-producer:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:music-producer:native
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:events:python
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:sdk:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:runtime:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: node --test scripts/tests/runtime-container.test.mjs scripts/tests/bunny.test.mjs scripts/tests/bunny-backup.test.mjs scripts/tests/bunny-operations.test.mjs scripts/tests/bunny-deployment.test.mjs scripts/tests/mac-host.test.mjs deploy/container/tests/context.test.mjs deploy/container/tests/entrypoint.test.mjs deploy/container/tests/runtime.test.mjs deploy/container/tests/provision-local.test.mjs deploy/container/tests/production-acceptance.test.mjs apps/runtime/tests/mac-codex-hook.test.mjs
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:runtime:scenarios:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:lifecycle:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:lifecycle:python
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:lifecycle:package:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:agent-state:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:agent-state:python
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:agent-state:package:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:wispr:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:wispr:package:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'chompi')
        run: npm run test:chompi-bridge:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'chompi')
        run: npm run test:chompi-bridge:scenarios
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:mcp:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:mcp:protocol:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:mcp:package:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:pixoo:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:nanoleaf:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:playback:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:lifx-module:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:tidbyt-module:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:codex-desktop:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:wispr-module:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        # Includes #501 preference lifecycle/import/rollback and private-state checks.
        run: npm run test:companions:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:roborock-transport:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:roborock-transport:consumer:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:roborock:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:wemo:built
      - name: Art module
        if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:art:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:volcano:built
      - name: Weather module
        if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:weather:built
      - name: Reachy simulator module
        if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:reachy:built
      - name: MicroDuck simulator module
        if: contains(fromJSON(needs.select.outputs.groups), 'modules')
        run: npm run test:microduck:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:roborock:consumer:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:volcano:consumer:built
      # The old dashboard's unit tests stay, because #922 copies the dashboard into the runtime; App verification runs its browser smoke check.
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:dashboard
      # The runtime's dashboard (#922): its unit tests here, its browser smoke check in App verification.
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:runtime-dashboard:built
  # A job skipped before its matrix expands reports its name with the matrix expression unexpanded, so the two jobs
  # the selection can skip name their single runner instead of using a matrix.
  firmware:
    name: Firmware host tests and ARM build on ubuntu-latest
    needs: select
    if: needs.select.outputs.firmware == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm run test:firmware
      - run: npm run test:firmware:arm
  app-verify:
    name: App verification on ubuntu-latest
    needs: select
    if: needs.select.outputs.app-verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Preserve #366's finite 40-minute budget for browser journeys and the existing apt retries.
    # Runtime catalog verification now has its own required job; this job retains all other checks (#1183).
    # GitHub-hosted runners have a systemd user manager, but app-verify's lease timer does not read back under their
    # systemd 255 (#873). Hiding the user bus keeps the coverage Depot's runner gave: lifecycle tests skip.
    env:
      XDG_RUNTIME_DIR: ''
      DBUS_SESSION_BUS_ADDRESS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Hosted runners sometimes stall in apt downloads during --with-deps until the job's limit (#862). The script gives
      # each attempt 300 s, above the slowest successful install so far (293 s, on #987's own run), and retries a stalled
      # or failed attempt twice. An install that runs past 300 s costs a retry, which resumes from apt's cache, not a failure.
      - name: Install Chromium with its system dependencies
        timeout-minutes: 20
        run: bash scripts/apt-retry.sh 300 npx playwright install --with-deps chromium
      - run: npm run build
      # Lifecycle tests need a systemd user manager and skip with a printed reason without one (hidden above, #873); unsupervised capture tests always run.
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:app-verify:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:app-verify:package:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:verify-host
      # Hub #853: CHOMPI bridge boundary checks with real crossing runs, every capture step through runCaptureStep, and the control page's browser and accessibility check.
      - if: contains(fromJSON(needs.select.outputs.groups), 'chompi')
        run: npm run test:chompi-bridge:verify:built
      - if: contains(fromJSON(needs.select.outputs.groups), 'chompi')
        run: npm run test:chompi-bridge:browser
      # The old dashboard's browser smoke check (#827); the full `test:dashboard:browser` suite runs locally.
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:dashboard:smoke
      # The runtime dashboard's browser smoke check (#922); the full `test:runtime-dashboard:browser` suite runs locally.
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:runtime-dashboard:smoke
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: node apps/runtime/dashboard/tests/timeline-card.browser.ts
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: node apps/runtime/dashboard/tests/playback-artwork.browser.ts
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: node apps/runtime/dashboard/tests/room-models.browser.ts
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: node apps/runtime/dashboard/tests/music-card.browser.ts
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: node apps/runtime/dashboard/tests/nanoleaf-pages.browser.ts
      # #1112: the shell at a television viewport, driven from the keyboard only; synthetic, qualifies no TV browser.
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: node apps/runtime/dashboard/tests/tv.browser.ts
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:roborock:browser
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:volcano:browser
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        # Includes #501 preferences, active-only copy, import/export and accessibility.
        run: npm run test:companions:browser
      - if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:wemo:browser
      - name: Reachy controls browser
        if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:reachy:browser
      - name: MicroDuck controls browser
        if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:microduck:browser
      - name: Art gallery and safe Home placement
        if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:art:browser
      - name: Art theme and browser preferences
        if: contains(fromJSON(needs.select.outputs.groups), 'runtime')
        run: npm run test:art-theme:browser
      - if: contains(fromJSON(needs.select.outputs.groups), 'shared')
        run: npm run test:observability:browser
  runtime-verify:
    name: Runtime verification on ubuntu-latest
    needs: select
    if: needs.select.outputs.runtime-verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Allow setup and the full serial catalog to finish and report failing cases (#1497).
    env:
      XDG_RUNTIME_DIR: ''
      DBUS_SESSION_BUS_ADDRESS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium with its system dependencies
        timeout-minutes: 20
        run: bash scripts/apt-retry.sh 300 npx playwright install --with-deps chromium
      - run: npm run build
      # Active catalog, including shared keyboard, phone and accessibility checks.
      - run: npm run test:runtime:verify:built
  gate:
    name: Selected checks gate
    needs: [select, core, firmware, app-verify, runtime-verify]
    # Runs even when the selection or a job failed, so a failure, cancellation or unexpected skip fails this check.
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/ci-selection
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-selection/cli.mjs gate
