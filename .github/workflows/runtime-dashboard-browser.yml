# The full runtime dashboard browser suite after each push to main that the affected-check selector maps to the
# runtime group (#1942). Pull request App verification runs its smoke check and seven journeys; this workflow runs every
# journey once a change has merged. It gates no pull request, is not a required check and adds nothing to the
# Selected checks gate. A failure on main comments on the one open issue with a fixed title, or opens it.
# A pull request runs it only when it changes this workflow or its script, as proof on a hosted runner; it files nothing.
# Both jobs always run, so the delivery preflight's read of main's jobs finds them; when a push selects no runtime
# path, the suite job reports success after its select step, as the core job does for steps the selection omits.
name: Runtime dashboard browser suite
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/runtime-dashboard-browser.yml'
      - 'scripts/ci-selection/runtime-browser.mjs'
  workflow_dispatch: {}
permissions:
  contents: read
# One run per pushed revision or pull request; a newer push never cancels a run in progress.
concurrency:
  group: runtime-dashboard-browser-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
jobs:
  suite:
    name: Runtime dashboard browser suite on ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # About 16 minutes for the suite on the owner's PC; the limit covers a slower hosted runner, setup and build and a
    # Chromium install that uses its whole 20-minute step limit.
    timeout-minutes: 60
    outputs:
      journey: ${{ steps.suite.outputs.journey }}
    # The same environment as App verification, where the smoke check and seven of these journeys already run (#873).
    env:
      XDG_RUNTIME_DIR: ''
      DBUS_SESSION_BUS_ADDRESS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection/runtime-browser.mjs select
      - if: steps.select.outputs.run == 'true'
        run: npm ci
      # Hosted runners sometimes stall in apt downloads during --with-deps (#862); the script retries as in App verification.
      - name: Install Chromium with its system dependencies
        if: steps.select.outputs.run == 'true'
        timeout-minutes: 20
        run: bash scripts/apt-retry.sh 300 npx playwright install --with-deps chromium
      - if: steps.select.outputs.run == 'true'
        run: npm run build
      # Every journey of `npm run test:runtime-dashboard:browser`, in its order, stopping at the first failure.
      - id: suite
        if: steps.select.outputs.run == 'true'
        run: node scripts/ci-selection/runtime-browser.mjs run
  report:
    name: Report runtime dashboard browser failures
    needs: suite
    # Runs after every suite result; the script files only for a push to main whose suite did not succeed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/ci-selection
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          SUITE_RESULT: ${{ needs.suite.result }}
          FAILED_JOURNEY: ${{ needs.suite.outputs.journey }}
        run: node scripts/ci-selection/runtime-browser.mjs report
