# The full runtime dashboard browser suite after each push to main that the affected-check selector maps to the
# runtime group (#1942). Pull request App verification runs its smoke check and seven journeys; this workflow runs every
# journey once a change has merged. It gates no pull request, is not a required check and adds nothing to the
# Selected checks gate. A failure on main comments on the one open issue with a fixed title, or opens it.
# A pull request runs it only when it changes this workflow or its script, as proof on a hosted runner; it files nothing.
# Since #2015 the suite job is a matrix: each group, `test:runtime-dashboard:browser:<group>` in package.json, runs in
# its own job, and the report job runs once after every group has finished.
# Every job always runs, so the delivery preflight's read of main's jobs finds them; when a push selects no runtime
# path, each suite job reports success after its select step, as the core job does for steps the selection omits.
name: Runtime dashboard browser suite
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/runtime-dashboard-browser.yml'
      - 'scripts/ci-selection/runtime-browser.mjs'
  workflow_dispatch: {}
permissions:
  contents: read
# A failed group uploads the screenshots and dumps its journeys wrote here (#2059).
env:
  TEST_EVIDENCE_DIR: /tmp/test-evidence
# One run per pushed revision or pull request; a newer push never cancels a run in progress.
concurrency:
  group: runtime-dashboard-browser-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false
jobs:
  suite:
    name: Runtime dashboard browser suite (group ${{ matrix.group }}) on ubuntu-latest
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # The groups of package.json's test:runtime-dashboard:browser, balanced by hosted journey times (#2015). A failing
    # group does not stop the others, so the report can name every group's failing journey.
    strategy:
      fail-fast: false
      matrix:
        group: ['1', '2', '3']
    # The longest group, home-idle.browser.ts, takes about 11 minutes on a hosted runner; the limit covers a slower
    # runner, setup and build and a Chromium install that uses its whole 20-minute step limit.
    timeout-minutes: 60
    # Each group sets only its own outputs, so the report job reads every group's result (a matrix job's outputs merge).
    outputs:
      skipped_1: ${{ steps.select.outputs.skipped_1 }}
      passed_1: ${{ steps.suite.outputs.passed_1 }}
      journey_1: ${{ steps.suite.outputs.journey_1 }}
      skipped_2: ${{ steps.select.outputs.skipped_2 }}
      passed_2: ${{ steps.suite.outputs.passed_2 }}
      journey_2: ${{ steps.suite.outputs.journey_2 }}
      skipped_3: ${{ steps.select.outputs.skipped_3 }}
      passed_3: ${{ steps.suite.outputs.passed_3 }}
      journey_3: ${{ steps.suite.outputs.journey_3 }}
    # The same environment as App verification, where the smoke check and seven of these journeys already run (#873).
    env:
      XDG_RUNTIME_DIR: ''
      DBUS_SESSION_BUS_ADDRESS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUITE_GROUP: ${{ matrix.group }}
        run: node scripts/ci-selection/runtime-browser.mjs select
      - if: steps.select.outputs.run == 'true'
        run: npm ci
      # Hosted runners sometimes stall in apt downloads during --with-deps (#862); the script retries as in App verification.
      - name: Install Chromium with its system dependencies
        if: steps.select.outputs.run == 'true'
        timeout-minutes: 20
        run: bash scripts/apt-retry.sh 300 npx playwright install --with-deps chromium
      - if: steps.select.outputs.run == 'true'
        run: npm run build
      # Every journey of this group's `npm run test:runtime-dashboard:browser:<group>`, in its order, stopping at the
      # first failure.
      - id: suite
        if: steps.select.outputs.run == 'true'
        env:
          SUITE_GROUP: ${{ matrix.group }}
        run: node scripts/ci-selection/runtime-browser.mjs run "$SUITE_GROUP"
      - if: failure()
        uses: ./.github/actions/failure-evidence
        with:
          name: runtime-dashboard-browser-${{ matrix.group }}
  report:
    name: Report runtime dashboard browser failures
    needs: suite
    # Runs once after every group's result; the script files only for a push to main whose suite did not succeed. The
    # sparse checkout also has the root files, so the script reads the groups from package.json.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/ci-selection
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          SUITE_RESULT: ${{ needs.suite.result }}
          SUITE_OUTPUTS: ${{ toJSON(needs.suite.outputs) }}
        run: node scripts/ci-selection/runtime-browser.mjs report
