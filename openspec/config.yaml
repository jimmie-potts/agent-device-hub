schema: spec-driven
context: |
  B.U.N.N.Y. uses one TypeScript runtime under apps/runtime, its fixed shipped
  modules under modules/, the SDK bus under packages/sdk and message profile 2.0.
  The accepted fresh cutover #840 records installed and representative physical
  evidence. Old writers are stopped and disabled; legacy code, units, stores and
  1.x contracts remain for manual return until separately authorized retirement.
  Source tests and diagrams do not establish installed or physical acceptance.
  GitHub issues own scope, acceptance, dependencies, status and delivery targets.
  Read AGENTS.md, docs/sdlc.md, docs/architecture.md and the exact linked issue.
  For collection, retention, diagnostics, exports or evidence publication, read
  docs/decisions/0011-private-personal-data-retention.md. Retain selected personal
  data privately, including logs and telemetry; keep it out of GitHub. Preserve
  credential protection, explicit sharing choices and safe clearing/recovery.
  Read docs/decisions/0012-bunny-event-platform.md before changing communication,
  errors, logs or traces, and the owning runtime/module guides before implementation.
  Keep one authoritative state owner and one designated writer per device. Runtime
  fresh setup/manual return is in apps/runtime/SETUP.md; the legacy Hub installer
  does not update bunny-runtime.service. No new host, migration or device authority
  follows from source delivery.
  Keep activity, attention, notices, optional read evidence and freshness distinct.
  Use versioned allowlisted metadata, title/project display names and label provenance.
  Credentials and tokens remain excluded; prompt/response capture is separate Hub #425. Hooks fail open and never command devices.
  Generate no local shared skills. Source, installation, client and physical
  verification have separate acceptance and authorization boundaries.
rules:
  proposal:
    - Link the exact owning GitHub issue and affected cross-repository contracts.
    - Use gh-<issue-number>-<slug> under this worktree's openspec/changes; inspect active and archived identities first.
  specs:
    - Write observable scenarios linked to issue criteria, without copying tracker status.
  design:
    - Evaluate schema-based design criteria; cover ownership, timing, migration, privacy, failure and recovery when affected.
  tasks:
    - Every task names observable evidence; use meaningful focused red-green-refactor for product behavior.
    - Keep revision-specific reviews and CI receipts in the PR, not the reviewed commit.
